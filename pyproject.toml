[project]
name = "graphrag-example"
version = "0.1.0"
description = "GraphRAG implementation example for a healthcare product catalog"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "pandas",
    "networkx",
    "matplotlib",
    "numpy",
    "graphrag>=3.1.2,<4",
]

[tool.uv]
# graphrag pins nltk~=3.9.0, but nltk <3.10.0 has several high-severity
# advisories (GHSA-m42h-3232-vpv3, GHSA-qvv7-cg9c-w4x3, GHSA-xh95-f55m-82fw,
# GHSA-fg7f-2386-8897, GHSA-6hm5-jgcp-p838). Override the pin to a patched release.
# The previous pyarrow override is no longer needed: graphrag >=3.1.2 requires
# pyarrow~=25.0, which is already past the GHSA-rgxp-2hwp-jwgg fix.
override-dependencies = ["nltk>=3.10.3,<4"]
